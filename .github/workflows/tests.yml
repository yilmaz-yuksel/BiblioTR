name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pytest-cov
      - name: Run tests
        run: pytest -q -W error::FutureWarning --cov=bibliotr --cov-branch --cov-report=term

  lowest-dependencies:
    # pyproject.toml'daki alt sınırların gerçekten çalıştığını sınar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install lowest direct dependencies
        run: |
          uv venv -p 3.10
          uv pip install --resolution lowest-direct -e ".[dev]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q
